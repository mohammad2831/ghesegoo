version: '3.8'

services:
  # ۱. سرویس پیام‌رسان (Broker)
  redis:
    image: redis:alpine
    container_name: ghesegoo_redis
    networks:
      - ghesegoo_network

  # ۲. سرور اصلی جانگو (فقط پاسخگویی به API)
  ai_ghesegoo:
    build: .
    container_name: ai_ghesegoo
    ports:
      - "8001:8000"
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - ./media:/app/media
    depends_on:
      - redis
    networks:
      - ghesegoo_network
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - HF_TOKEN=${HF_TOKEN}
      - FORKED_BY_MULTIPROCESSING=1

  # ۳. ورکر سلری سبک (متن و API فردوسی)
  celery_default:
    build: .
    container_name: ghesegoo_celery_default
    # گوش دادن فقط به صف default با ۴ پردازش موازی
    command: celery -A ai_ghesegoo worker -Q default_queue --concurrency=4 --loglevel=info
    volumes:
      - .:/app
      - ./media:/app/media
    depends_on:
      - redis
      - ai_ghesegoo
    networks:
      - ghesegoo_network
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  # ۴. ورکر سلری سنگین (تولید صوت با GPU و Chatterbox)
  celery_gpu:
      build: .
      container_name: ghesegoo_celery_gpu
    # گوش دادن فقط به صف gpu با پردازش تک‌نخی (solo) برای جلوگیری از خطای CUDA و OOM
      command: celery -A ai_ghesegoo worker -Q gpu_queue -l info --pool=solo
      volumes:
        - .:/app
        - ./media:/app/media
      # متصل کردن پوشه کش مدل‌ها به هارد سیستم شما
        - ./hf_cache:/app/hf_cache
      depends_on:
        - redis
        - ai_ghesegoo
      networks:
        - ghesegoo_network
      environment:
        - CELERY_BROKER_URL=redis://redis:6379/0
        - CELERY_RESULT_BACKEND=redis://redis:6379/0
        - HF_TOKEN=${HF_TOKEN}
      # معرفی مسیر کَش به هاگینگ‌فیس تا دانلودها در رم سرگردان نشوند
        - HF_HOME=/app/hf_cache
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities: [gpu, compute, utility]

networks:
  ghesegoo_network:
    driver: bridge
